<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSlide StarDist Viewer</title>
    <style>
      :root {
        color: #17201b;
        background: #f7f9f6;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 760px;
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
      }
      a {
        color: #176b87;
        font-weight: 700;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenSlide StarDist Viewer</h1>
      <p>
        Local pathology slide viewing, tiled OpenSlide streaming, nuclei segmentation, and cell counting.
      </p>
      <p>
        The full viewer is being published in the next commits. This placeholder enables GitHub Pages from day one.
      </p>
      <div class="links">
        <a href="https://github.com/baditaflorin/openslide-stardist-viewer">Star on GitHub</a>
        <a href="https://www.paypal.com/paypalme/florinbadita">Support via PayPal</a>
      </div>
    </main>
  </body>
</html>
